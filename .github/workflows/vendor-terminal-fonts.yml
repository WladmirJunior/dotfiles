name: Vendor terminal fonts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vendor-terminal-fonts.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download fonts and licenses
        shell: bash
        run: |
          set -euo pipefail

          NERD_FONTS_REF="c26820b5b8b0669c5473e82c45e46084d3e94f3d"
          DEPARTURE_REF="75152a3f1e6dacdd248a6c397c97dbf27e33eea0"

          mkdir -p fonts/terminus fonts/3270 fonts/departure-mono fonts/berkeley-mono

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/ryanoasis/nerd-fonts/${NERD_FONTS_REF}/src/unpatched-fonts/Terminus/TerminusTTF-4.49.3.ttf" \
            -o fonts/terminus/TerminusTTF-4.49.3.ttf
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/ryanoasis/nerd-fonts/${NERD_FONTS_REF}/src/unpatched-fonts/Terminus/LICENSE.txt" \
            -o fonts/terminus/LICENSE.txt

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/ryanoasis/nerd-fonts/${NERD_FONTS_REF}/src/unpatched-fonts/3270/Regular/3270-Regular.ttf" \
            -o fonts/3270/3270-Regular.ttf
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/ryanoasis/nerd-fonts/${NERD_FONTS_REF}/src/unpatched-fonts/3270/LICENSE.txt" \
            -o fonts/3270/LICENSE.txt

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/rektdeckard/departure-mono/${DEPARTURE_REF}/public/assets/DepartureMono-1.500.otf" \
            -o fonts/departure-mono/DepartureMono-1.500.otf
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/rektdeckard/departure-mono/${DEPARTURE_REF}/public/assets/LICENSE" \
            -o fonts/departure-mono/LICENSE.txt

          cat > fonts/berkeley-mono/README.md <<'EOF'
          # Berkeley Mono

          Berkeley Mono is intentionally not vendored in this public repository.

          It is a proprietary commercial typeface from U.S. Graphics Company and is distributed under paid/trial license terms rather than an open redistribution license. Keep a licensed local copy outside the public dotfiles repository.

          Official source: https://usgraphics.com/products/berkeley-mono
          EOF

          cat > fonts/README.md <<'EOF'
          # Terminal fonts

          Fonts selected for the vintage CRT / terminal aesthetic used by the Blink Shell themes in this repository.

          - `terminus/TerminusTTF-4.49.3.ttf` — Terminus
          - `3270/3270-Regular.ttf` — IBM 3270
          - `departure-mono/DepartureMono-1.500.otf` — Departure Mono
          - `berkeley-mono/` — metadata only; Berkeley Mono is proprietary and is not redistributed here

          Each vendored open font includes its upstream license file.
          EOF

          file fonts/terminus/TerminusTTF-4.49.3.ttf
          file fonts/3270/3270-Regular.ttf
          file fonts/departure-mono/DepartureMono-1.500.otf

      - name: Commit vendored fonts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Wladmir Júnior"
          git config user.email "wlad.w.junior@gmail.com"

          rm -f .github/workflows/vendor-terminal-fonts.yml
          git add fonts .github/workflows/vendor-terminal-fonts.yml
          git commit -m "feat: vendor terminal fonts"
          git push origin HEAD:main
