name: Installer checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
      - name: Lint shared installer libraries
        run: >-
          shellcheck -x
          -e SC1090,SC1091,SC2034
          lib/detect.sh lib/exec.sh lib/state.sh lib/step.sh lib/telemetry.sh
          lib/template.sh lib/theme.sh lib/transaction.sh lib/trash.sh lib/ui.sh
          lib/setup/selection.sh lib/packages/*.sh
          scripts/install-github-release.sh scripts/trash-tool.sh
          scripts/install-1password-arch.sh scripts/install-1password-debian.sh
          scripts/install-1password-fedora.sh scripts/install-yazi.sh
          scripts/install-fastfetch.sh
      - name: Lint orchestrator, uninstaller and steps
        run: >-
          shellcheck -x --severity=error
          -e SC1090,SC1091,SC2034
          install.sh uninstall.sh steps/*.sh
      - name: Run installer tests
        run: bash tests/run.sh

  tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install a modern bash (macOS ships 3.2)
        run: brew list bash >/dev/null 2>&1 || brew install bash
      - name: Run installer tests
        run: '"$(brew --prefix)/bin/bash" tests/run.sh'
