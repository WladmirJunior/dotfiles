name: Installer checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
      - name: Lint shared installer libraries
        run: >-
          shellcheck -x
          -e SC1090,SC1091,SC2034
          lib/exec.sh lib/state.sh lib/step.sh lib/transaction.sh
          lib/setup/selection.sh lib/packages/brew.sh
          scripts/install-github-release.sh
      - name: Run installer tests
        run: bash tests/run.sh
