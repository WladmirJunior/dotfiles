# Keep Enter focused on terminal editing, while the interactive opener (`O`)
# can delegate text and code files to the operating system's default app.
[opener]
edit = [
  { run = '${EDITOR:-vi} %s', desc = "Neovim", for = "unix", block = true },
]

[open]
prepend_rules = [
  { mime = "text/*", use = [ "edit", "open", "reveal" ] },
  { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "open", "reveal" ] },
  { mime = "inode/empty", use = [ "edit", "open", "reveal" ] },
]

# Render Markdown previews with glow (Reledia/glow plugin, deps in package.toml).
[[plugin.prepend_previewers]]
name = "*.md"
run = "glow"

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
