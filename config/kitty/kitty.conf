# Kitty config: retro green-phosphor theme, live-tuning stage.
#
# This file exists so the terminal theme (colors + font + opacity) can be tuned
# WITH real content on screen. Kitty reloads font_family / font_size / colors on
# an existing window via  kill -SIGUSR1 $KITTY_PID  (or ctrl+shift+f5).
# Once the look is settled here it gets ported to the Ghostty config.
#
# Reload from anywhere:  kill -SIGUSR1 "$(pgrep -x kitty | head -1)"

# Font
font_family      Terminess Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        18
# Kitty's take on font-thicken: nudge glyph weight without a bold face
text_composition_strategy 1.0 30
modify_font cell_height 112%

# Core palette (calibrated against the CRT reference photos).
# Background: very dark green, never pure black. Foreground: pale pastel phosphor
# green, not neon. Monochrome, no cyan, no amber.
foreground            #5fb56f
background            #060d08
cursor                #6fd67f
cursor_text_color     #060d08
selection_foreground  #060d08
selection_background  #173d1e

# 16-color ANSI ramp, all green tones.
color0  #0b1a0d
color1  #4fa85f
color2  #6fd67f
color3  #9fe89f
color4  #3f8f4f
color5  #5fbf6f
color6  #7fdc8f
color7  #8fd98f
color8  #2a4a30
color9  #6fd67f
color10 #9fe89f
color11 #bff0bf
color12 #4fa85f
color13 #7fdc8f
color14 #9fe89f
color15 #d6ffd6

# Transparency
background_opacity 0.92
background_blur 20

# Cursor
cursor_shape block
cursor_blink_interval 0.5

# Misc, so it behaves like a daily driver
scrollback_lines 20000
enable_audio_bell no
macos_option_as_alt yes
confirm_os_window_close 0
window_padding_width 6

# Explicit reload binding (default is also ctrl+shift+f5)
map cmd+shift+r load_config_file
map cmd+v paste_from_clipboard
map cmd+shift+, new_os_window nvim ~/.config/kitty/colors.conf
map cmd+o launch --type=os-window --cwd=current zsh -c 'yazi'

# Added by Gogh
include colors.conf
