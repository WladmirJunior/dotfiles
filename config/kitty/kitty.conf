# Kitty configuration: calibrated retro CRT phosphor aesthetic.
# Ported from Ghostty retro profile and Cool Retro Term shaders calibration.

# Font defaults (can be overridden by active theme in theme.conf)
font_family      Terminess Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        24.0

# Phosphor thicken: simulates electron beam phosphor bloom without bold font
text_composition_strategy 1.0 30
modify_font cell_height 100%
modify_font cell_width 100%

# Window styling matching Ghostty CRT (padding-x: 26, padding-y: 24)
window_padding_width 24 26
confirm_os_window_close 0
scrollback_lines 100000
enable_audio_bell no
macos_option_as_alt yes

# Cursor
cursor_shape block
cursor_blink_interval 0.5

# Keybindings
map cmd+shift+r load_config_file
map cmd+v paste_from_clipboard
map cmd+shift+, new_os_window nvim ~/.config/kitty/kitty.conf
map cmd+o launch --type=os-window --cwd=current zsh -c 'yazi'

# Active theme (retro, ghost, green, amber)
include theme.conf
