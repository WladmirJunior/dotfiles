# ─────────────────────────── Prefix ───────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─────────────────────────── General ───────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,xterm-ghostty:Tc"

# CSI-u, so modifiers survive the trip through tmux. The legacy protocol has no
# way to say "Enter with Shift" (Enter is just \r), so tmux dropped the modifier
# and Claude Code saw a plain Enter: the message got sent instead of breaking
# the line. `always` rather than `on` because Claude Code's own negotiation
# does not always cross tmux cleanly.
#
# This only affects combinations the legacy protocol threw away (Shift+Enter,
# Ctrl+Enter, some Shift+Tab, Ctrl+digit). Ordinary keys, Ctrl+letter and
# Ctrl/Shift+arrow keep their old encoding, and tmux's own binds are consumed
# before any of this. The one risk is an old TUI that cannot read CSI-u showing
# literal noise like [13;2u; drop to `on` if that ever shows up.
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features ",xterm*:extkeys"
set -as terminal-features ",xterm-ghostty:extkeys"

set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# ─────────────────────────── Splits ───────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Closing, following the macOS gesture rather than tmux's default & and x:
# w closes the pane, or the whole window when it is the last one, the way
# Cmd+W behaves. q kills the session.
#
# q saves the resurrect snapshot first. Without that, continuum's 15 minute
# timer means a killed session comes back on the next restore, which is not
# what "kill" should mean.
bind w if-shell -F "#{==:#{window_panes},1}" \
    'confirm-before -p "kill window #W? (y/n)" kill-window' \
    'confirm-before -p "kill pane #P? (y/n)" kill-pane'
bind q confirm-before -p "kill session #S? (y/n)" \
    'run-shell "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh" ; kill-session'

# q was display-panes and w was choose-tree; keep both on nearby keys.
bind Q display-panes
bind W choose-tree -Zw

# ─────────────────────────── Pane nav (vim-style) ───────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─────────────────────────── Reload ───────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# ─────────────────────────── Copy mode (vi + macOS pbcopy) ───────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Smooth mouse selection: drag copies without exiting copy mode or jumping screen
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection

# Double-click selects word and copies; triple-click selects line and copies
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "pbcopy"
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; send-keys -X select-word ; send-keys -X copy-pipe-no-clear pbcopy"
bind -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; send-keys -X select-line ; send-keys -X copy-pipe-no-clear pbcopy"

# ─────────────────────────── Status bar ───────────────────────────
# `terminal` is tmux's keyword for the terminal's own default colour, so the
# bar inherits whatever Ghostty is running without repeating its hex values
# here. Hierarchy comes from attributes (bold/dim/reverse) instead of hue,
# which is what a monochrome palette needs. No powerline glyphs: Greybeard is
# a bitmap face and would render them as tofu.
set -g status-position top
set -g status-interval 5
set -g status-style "bg=terminal,fg=terminal"

set -g status-left "#[bold] #S #[none]"
set -g status-left-length 30

# pane_title carries the running program's own title, which for Claude Code and
# the other agents is their live state ("✳ ghost-theme-final", "◐︎ Qwen - dev").
# pane_current_command is deliberately absent: it reports the binary, which for
# Claude Code is just a version string.
set -g status-right "#[dim]#{pane_title}  %d %b %H:%M #[none]"
set -g status-right-length 80

# Current window reversed, the others dim: readable without a second colour.
setw -g window-status-format "#[dim] #I #W#{?window_zoomed_flag,+,} #[none]"
setw -g window-status-current-format "#[reverse] #I #W#{?window_zoomed_flag,+,} #[none]"
setw -g window-status-separator ""

# Same idea for panes: the active border is bright, the rest recede.
set -g pane-border-style "fg=terminal,dim"
set -g pane-active-border-style "fg=terminal,none"
set -g message-style "reverse"

# ─────────────────────────── Plugins (tpm) ───────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'
