# ─────────────────────────── Prefix ───────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─────────────────────────── General ───────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,xterm-ghostty:Tc"

# CSI-u, so modifiers survive the trip through tmux. The legacy protocol has no
# way to say "Enter with Shift" (Enter is just \r), so tmux dropped the modifier
# and Claude Code saw a plain Enter: the message got sent instead of breaking
# the line. `always` rather than `on` because Claude Code's own negotiation
# does not always cross tmux cleanly.
#
# This only affects combinations the legacy protocol threw away (Shift+Enter,
# Ctrl+Enter, some Shift+Tab, Ctrl+digit). Ordinary keys, Ctrl+letter and
# Ctrl/Shift+arrow keep their old encoding, and tmux's own binds are consumed
# before any of this. The one risk is an old TUI that cannot read CSI-u showing
# literal noise like [13;2u; drop to `on` if that ever shows up.
set -g extended-keys always
set -as terminal-features ",xterm*:extkeys"
set -as terminal-features ",xterm-ghostty:extkeys"

set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# ─────────────────────────── Splits ───────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ─────────────────────────── Pane nav (vim-style) ───────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─────────────────────────── Reload ───────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# ─────────────────────────── Copy mode (vi + macOS pbcopy) ───────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ─────────────────────────── Status bar ───────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=green,bold] #S "
set -g status-right "#[fg=yellow]%a %d %b #[fg=cyan]%H:%M "
set -g status-left-length 40

# ─────────────────────────── Plugins (tpm) ───────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'
